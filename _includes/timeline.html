<ul class="timeline">
  {% for it in include.items %}
    <li class="timeline__item">
      <div class="timeline__period">{{ it.period }}</div>
      <div class="timeline__title">{{ it.title }}</div>
      {% if it.org %}<div class="timeline__org">{{ it.org }}</div>{% endif %}
      {% if it.text %}<div class="timeline__text">{{ it.text }}</div>{% endif %}
    </li>
  {% endfor %}
</ul>
