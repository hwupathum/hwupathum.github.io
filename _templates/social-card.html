<!DOCTYPE html><html><head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#0B0D10;color:#E7EAEE;font-family:Inter,sans-serif;overflow:hidden}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 88px;border-bottom:6px solid #6EE7B7}
.text{display:flex;flex-direction:column;gap:22px;max-width:620px}
.logo{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500}
.mark{width:14px;height:14px;border-radius:3px;background:#6EE7B7}
h1{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:84px;line-height:1.02;letter-spacing:-0.02em;color:#F4F6F8}
p{margin:0;font-family:'Space Grotesk',sans-serif;font-size:32px;line-height:1.3;color:#C5CCD5}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{padding:8px 16px;border:1px solid #2E3640;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#C5CCD5}
.hex{width:360px;color:#6EE7B7}.hex svg{display:block;width:360px;height:auto}
</style></head><body><div class="wrap">
<div class="text">

<div class="pills"><span class="pill">post-quantum</span><span class="pill">IAM</span><span class="pill">TLS</span></div>
</div>
