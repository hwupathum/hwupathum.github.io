# Built natively by GitHub Pages (no Actions workflow, no build step).
title: Udara Pathum
description: >-
  Articles on post-quantum cryptography, identity and access management, TLS
  and software engineering.
url: https://hwupathum.github.io
baseurl: ""
lang: en
timezone: Asia/Colombo
future: true # show upcoming talks (and any future-dated posts)

author:
  name: Udara Pathum
  handle: udara.pathum # shown next to the logo mark in the header
  avatar: /assets/images/udara.jpg
  tagline: >-
    Associate Technical Lead at WSO2, building identity & access management —
    and working on what keeps it secure in a post-quantum world.
  intro: >-
    I build secure, scalable backend systems in Java and Go. I'm drawn to
    cryptography, secure protocol design and quantum computing, and I write
    about post-quantum security along the way.
  topics: [post-quantum security, identity & access, Java, Go]

# Footer and hero links.
links:
  github: https://github.com/hwupathum
  linkedin: https://www.linkedin.com/in/hwupathum/
  medium: https://medium.com/@hwupathum

contact:
  heading: Let’s talk identity, crypto or post-quantum security.
  text: Reach out about talks, collaboration, or anything in this space.

permalink: /articles/:title/
markdown: kramdown

collections:
  talks:
    output: false
  projects:
    output: false

include:
  - _pages

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _templates
