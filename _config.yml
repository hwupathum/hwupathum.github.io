# Built natively by GitHub Pages (no Actions workflow, no build step).
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

locale: en-US
title: Udara Pathum
subtitle: Articles on PQC, IAM and TLS
name: Udara Pathum
description: >-
  Articles on post-quantum cryptography, identity and access management, TLS
  and software engineering.
url: https://hwupathum.github.io
baseurl: ""
repository: hwupathum/hwupathum.github.io
timezone: Asia/Colombo
future: true # show upcoming talks (and any future-dated posts)

search: true
search_full_content: true

author:
  name: Udara Pathum
  avatar: # e.g. /assets/images/avatar.jpg
  bio: Software engineer at WSO2. Writing about post-quantum cryptography, IAM and TLS.
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/hwupathum

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/hwupathum

markdown: kramdown
permalink: /:categories/:title/
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

include:
  - _pages

# Talks and projects are listed on their pages; they have no pages of their own.
collections:
  talks:
    output: false
  projects:
    output: false

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
