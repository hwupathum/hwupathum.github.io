# Built natively by GitHub Pages (no Actions workflow, no build step).
title: Udara Pathum
description: >-
  Articles on post-quantum cryptography, identity and access management, TLS
  and software engineering.
url: https://hwupathum.github.io
baseurl: ""
lang: en
timezone: Asia/Colombo
future: true # show upcoming talks (and any future-dated posts)

author:
  name: Udara Pathum
  handle: udara.pathum # shown next to the logo mark in the header
  avatar: # placeholder until set, e.g. /assets/images/avatar.jpg
  tagline: >-
    Software engineer at WSO2, building identity & access management — and
    writing about what keeps it secure.
  intro: >-
    [Short intro — a sentence or two on what you work on, what you write about,
    and where you speak. Replace with your own copy.]
  topics: [post-quantum crypto, IAM, TLS, speaking]

# Footer and hero links. Replace the placeholder URLs.
links:
  github: https://github.com/hwupathum
  linkedin: https://www.linkedin.com/in/your-profile/ # placeholder
  medium: https://medium.com/@your-handle # placeholder

contact:
  heading: Let’s talk identity, crypto or TLS.
  text: "[Invite readers to reach out — for talks, collaboration or questions.]"

permalink: /articles/:title/
markdown: kramdown

collections:
  talks:
    output: false
  projects:
    output: false

include:
  - _pages

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _templates
